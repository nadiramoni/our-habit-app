name: Build Android APK (free, on GitHub's servers)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Bake owner's Firebase config (optional secret FIREBASE_CONFIG)
        env:
          FB: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FB" ]; then
            printf 'export const BAKED_FIREBASE: string | null = `%s`;\n' "$FB" > src/lib/firebase-baked.ts
            echo "Firebase config baked from secret ✓"
          else
            echo "Using the baked-in Firebase config already in the repo (owner's project our-habit-61587) ✓"
          fi

      - name: Move API routes away (static build has no server)
        run: mv src/app/api .apk-api-backup

      - name: Bake latest ads/update config into the APK
        run: node scripts/bake-cfg.mjs

      - name: Static export (out/)
        run: NEXT_EXPORT=1 npx next build

      - name: Setup Java 21 (needed for keytool + the APK build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure debug keystore exists (auto-create if missing)
        run: |
          mkdir -p android-keystore
          if [ ! -f android-keystore/ourhabit-debug.keystore ]; then
            echo "⚠ Keystore not committed — generating a fresh one on the runner"
            keytool -genkeypair -v \
              -keystore android-keystore/ourhabit-debug.keystore \
              -storepass ourhabit2026 -keypass ourhabit2026 \
              -alias ourhabit -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OurHabit, OU=App, O=OurHabit, L=Dhaka, ST=Dhaka, C=BD"
            echo "✓ Fresh debug keystore generated"
            keytool -list -v -keystore android-keystore/ourhabit-debug.keystore -storepass ourhabit2026 -alias ourhabit | grep -E "SHA1|SHA256"
          else
            echo "✓ Using committed debug keystore"
          fi

      - name: Place keystore at the path Gradle's signing config expects
        run: |
          if [ -f android-keystore/ourhabit-debug.keystore ]; then
            echo "✓ Keystore confirmed at workspace root: android-keystore/ourhabit-debug.keystore"
          else
            echo "✗ Keystore STILL missing — this should never happen"
            exit 1
          fi

      - name: Create Capacitor Android project + native plugin
        run: node scripts/prepare-apk.mjs

      - name: Re-confirm keystore after Capacitor ran
        run: |
          if [ -f android-keystore/ourhabit-debug.keystore ]; then
            echo "✓ Keystore still present at workspace root after Capacitor setup"
          else
            echo "✗ Keystore disappeared — aborting"
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/OurHabit-${GITHUB_REF_NAME:-build}.apk

      - name: Upload APK artifact (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: OurHabit-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to public Releases repo (APK only — source stays private)
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          cd apk-out
          cp OurHabit-*.apk OurHabit-latest.apk
          gh release create "$TAG" --repo nadiramoni/our-habit-apk --latest \
            --title "Our Habit $TAG" \
            --notes "📱 Our Habit — latest Android APK." \
            OurHabit-latest.apk
          echo "✅ Published: https://github.com/nadiramoni/our-habit-apk/releases/latest"
