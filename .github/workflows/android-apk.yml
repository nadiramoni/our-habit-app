name: Build Android APK (free, on GitHub's servers)

on:
  workflow_dispatch: {} # "Run workflow" button
  push:
    branches: ["main", "master"] # v4.0: ANY upload to the repo → auto-build (no Run-workflow step needed)
    tags: ["v*"] # push a tag like v1.2.0 → also creates a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }} # optional — enables publishing the APK to the public Releases repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v4.0: THE ONE-FILE UPDATE PATH. The owner uploads
      # our-habit-github-upload.zip (a FULL snapshot of the project) to the
      # repo root via GitHub's web "Add file → Upload files". This step
      # unpacks it OVER the checkout, so the build always uses the zip's
      # contents — no path mistakes, no missed files, no stale sources
      # (that's how the "same version 3.2.0 again and again" mess happened).
      # Old files that the zip no longer contains are simply overwritten or
      # ignored; every path the build needs comes from the zip.
      - name: Unpack our-habit-github-upload.zip (if present)
        run: |
          if [ -f our-habit-github-upload.zip ]; then
            unzip -o -q our-habit-github-upload.zip
            echo "✓ Unpacked our-habit-github-upload.zip — building ITS contents"
            APP_VER=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/version.ts | head -1)
            echo "APP_VER=$APP_VER" >> "$GITHUB_ENV"
            echo "✓ App version from the zip: v${APP_VER:-?}"
          else
            echo "No our-habit-github-upload.zip at the repo root — building the repo's own files"
            APP_VER=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/version.ts | head -1)
            echo "APP_VER=$APP_VER" >> "$GITHUB_ENV"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Bake owner's Firebase config (optional secret FIREBASE_CONFIG)
        env:
          FB: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FB" ]; then
            printf 'export const BAKED_FIREBASE: string | null = `%s`;\n' "$FB" > src/lib/firebase-baked.ts
            echo "Firebase config baked from secret ✓"
          else
            echo "Using the baked-in Firebase config already in the repo (owner's project our-habit-61587) ✓"
          fi

      - name: Move API routes away (static build has no server)
        run: mv src/app/api .apk-api-backup

      - name: Bake latest ads/update config into the APK
        run: node scripts/bake-cfg.mjs

      - name: Static export (out/)
        run: NEXT_EXPORT=1 npx next build

      - name: Setup Java 21 (needed for keytool + the APK build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure debug keystore exists (auto-create if missing)
        run: |
          mkdir -p android-keystore
          if [ ! -f android-keystore/ourhabit-debug.keystore ]; then
            echo "⚠ Keystore not committed — generating a fresh one on the runner"
            keytool -genkeypair -v \
              -keystore android-keystore/ourhabit-debug.keystore \
              -storepass ourhabit2026 -keypass ourhabit2026 \
              -alias ourhabit -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OurHabit, OU=App, O=OurHabit, L=Dhaka, ST=Dhaka, C=BD"
            echo "✓ Fresh debug keystore generated"
            keytool -list -v -keystore android-keystore/ourhabit-debug.keystore -storepass ourhabit2026 -alias ourhabit | grep -E "SHA1|SHA256"
          else
            echo "✓ Using committed debug keystore"
          fi

      - name: Place keystore at the path Gradle's signing config expects
        run: |
          # build.gradle uses '../../android-keystore/...' (2 ../ from android/app/ → workspace root)
          # → the keystore must be at <workspace>/android-keystore/, which is exactly where the repo is checked out
          # → no mirroring needed; we just confirm the file is in place
          if [ -f android-keystore/ourhabit-debug.keystore ]; then
            echo "✓ Keystore confirmed at workspace root: android-keystore/ourhabit-debug.keystore"
          else
            echo "✗ Keystore STILL missing — this should never happen"
            exit 1
          fi

      - name: Create Capacitor Android project + native plugin
        run: node scripts/prepare-apk.mjs

      - name: Re-confirm keystore after Capacitor ran (workspace root copy is never touched by cap add)
        run: |
          if [ -f android-keystore/ourhabit-debug.keystore ]; then
            echo "✓ Keystore still present at workspace root after Capacitor setup"
          else
            echo "✗ Keystore disappeared — aborting"
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/OurHabit-v${APP_VER:-x}-${GITHUB_REF_NAME:-build}.apk"

      - name: Upload APK artifact (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: OurHabit-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v4.0: the release TITLE now carries the real APP VERSION (from
      # src/lib/version.ts, read in the unpack step) — the owner kept seeing
      # "same version / same MB" for every release; now every release shows
      # exactly which app version it carries, e.g.
      # "Our Habit v4.0.0 · 2026.10.30-0527".
      - name: Publish APK to public Releases repo (APK only — source stays private)
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          TITLE="Our Habit v${APP_VER:-?} · ${TAG#v}"
          cd apk-out
          cp OurHabit-*.apk OurHabit-latest.apk
          gh release create "$TAG" --repo nadiramoni/our-habit-apk --latest \
            --title "$TITLE" \
            --notes "📱 Our Habit v${APP_VER:-?} — সর্বশেষ Android APK। Download → open → allow 'install unknown apps' → install. অ্যাপের ভেতরে Settings ⚙️ → About-এ ভার্সন দেখো। The app code stays private; this page only serves the APK." \
            OurHabit-latest.apk
          echo "✅ Published: https://github.com/nadiramoni/our-habit-apk/releases/latest (title: $TITLE)"
