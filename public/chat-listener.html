<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our Habit — chat listener</title>
</head>
<body>
<script>
/**
 * chat-listener.html — v5.1 BACKGROUND NOTIFICATIONS ENGINE.
 *
 * This page runs inside OhKeepAliveService's HEADLESS WebView on the SAME
 * origin as the app (https://localhost) — it therefore shares localStorage
 * with the main app:
 *   • "oh_chat_state" — written by the main app: {cfg, myUid, pairs, …}
 *   • "firebase:authUser:<apiKey>:[DEFAULT]" — the signed-in session, written
 *     by the main app's auth (browserLocalPersistence — v2.9's fix)
 *
 * v5.1 OWNER ROUND ("এই দুইটা ফিক্স করে দাও"):
 *   (1) MESSAGE NOTIFICATIONS: when a friend sends a message, THIS phone gets
 *       a real system notification with the message text — app closed or
 *       not. TAPPING it now opens STRAIGHT into that chat (the page writes
 *       "oh_open_chat" into the shared localStorage right before posting;
 *       the main app consumes it on boot/resume and jumps to the reply box).
 *   (2) INSTANT UPDATE NOTIFICATIONS: a realtime onSnapshot on app/meta —
 *       the moment the owner bumps latestVersion in the panel, EVERY
 *       connected phone gets "নতুন আপডেট চলে আসছে — অ্যাপটি আপডেট করে
 *       নতুন ফিচারগুলো উপভোগ করুন" in seconds (was a 5-min poll before).
 *       Tapping it opens the app with a forced config refresh (UpdateBar).
 *   (3) HEARTBEAT: "oh_listener_hb" is written every cycle — the in-app
 *       admin panel shows 🎧 জীবিত ✓ / সাড়া দিচ্ছে না from it.
 *
 * Loaded from assets by the service; NEVER shown to the user.
 */
(function () {
  "use strict";

  function log(msg) {
    try { if (window.OHNative && window.OHNative.log) window.OHNative.log(String(msg)); } catch (e) {}
    try { console.log("[chat-listener]", msg); } catch (e) {}
  }

  var FB_VER = "10.12.2";
  var app = null, db = null, auth = null, unsubs = {}, metaUnsub = null, myUid = "", booted = false;

  function readState() {
    try {
      var raw = localStorage.getItem("oh_chat_state");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // dynamic import of the firebase CDN modules (returns a promise)
  function loadMod(name) {
    // globalThis.import exists in modern WebViews only
    return import("https://www.gstatic.com/firebasejs/" + FB_VER + "/" + name);
  }

  function subscribePair(pair) {
        if (!pair || !pair.key || unsubs[pair.key]) return;
    try {
      loadMod("firebase-firestore.js").then(function (fs) {
        try {
          var q = fs.query(fs.collection(db, "pairs", pair.key, "notes"), fs.orderBy("createdAt", "asc"));
          unsubs[pair.key] = fs.onSnapshot(q, function (snap) {
            // v5.3.0: when real FCM push is live on this phone (oh_chat_state.fcm
            // = token saved AND the owner configured the FCM key) this legacy
            // listener STANDS DOWN — FCM delivers the notification instead, so
            // the user never sees the same message notify twice.
            try {
              var stNow = readState();
              if (stNow && stNow.fcm) return;
            } catch (e) {}
            snap.docChanges().forEach(function (ch) {
              if (ch.type !== "added") return;
              var d = ch.doc.data();
              if (!d || d.kind !== "chat") return;
              // v5.1: skip messages I hid from myself (hiddenBy) — no ghost notifs
              if (d.hiddenBy && d.hiddenBy.indexOf && d.hiddenBy.indexOf(myUid) >= 0) return;
              if (d.from === myUid) return; // my own message — no notification
              if (d.createdAt && Date.now() - d.createdAt > 120000) return; // stale (cold start)
              var fromName = d.fromName || pair.name || "Our Habit";
              var title = "💬 " + fromName;
              var body = d.text || "📷 " + (window.__hasBn ? "একটা ছবি পাঠিয়েছে" : "sent a photo");
              // v5.1 TAP ROUTER: write the handoff BEFORE posting — when the
              // user taps the notification, Android launches the main app,
              // which reads this flag and opens THIS chat directly (reply box).
              try {
                localStorage.setItem("oh_open_chat", JSON.stringify({ uid: d.from, name: fromName, at: Date.now() }));
              } catch (e) {}
              try {
                if (window.OHNative && window.OHNative.postNotification) {
                  window.OHNative.postNotification(title, body, pair.key);
                }
              } catch (e) { log("notify failed: " + e); }
            });
          }, function (err) {
            log("listener error " + pair.key + ": " + (err && err.code ? err.code : err));
            // rules/permission problem or offline — retry later via the state poll
            try { if (unsubs[pair.key]) { unsubs[pair.key](); delete unsubs[pair.key]; } } catch (e) {}
          });
          log("subscribed " + pair.key);
        } catch (inner) {
          log("subscribe failed: " + (inner && inner.message ? inner.message : String(inner)));
          // retry on the next state poll
          try { if (unsubs[pair.key]) { unsubs[pair.key](); delete unsubs[pair.key]; } } catch (e) {}
        }
      }).catch(function (e) { log("fs module load failed: " + e); });
    } catch (e) {
      log("subscribe error: " + e);
    }
  }

  function boot() {
    var st = readState();
    if (!st || !st.cfg || !st.cfg.apiKey || !st.cfg.projectId) {
      log("no state yet — waiting for the main app to write oh_chat_state");
      return false;
    }
    window.__hasBn = (st.lang || "bn") === "bn";
    return Promise.all([
      loadMod("firebase-app.js"),
      loadMod("firebase-auth.js"),
      loadMod("firebase-firestore.js")
    ]).then(function (mods) {
      var fbapp = mods[0], fbauth = mods[1], fs = mods[2];
      if (!app) {
        app = fbapp.initializeApp(st.cfg);
        db = fs.getFirestore(app);
        // localStorage persistence → restores the MAIN app's session (same origin)
        auth = fbauth.initializeAuth(app, {
          persistence: fbauth.browserLocalPersistence
        });
        fbauth.onAuthStateChanged(auth, function (u) {
          myUid = u ? u.uid : "";
          log("auth state: " + (u ? "signed in " + u.uid : "signed out"));
          resubscribe();
        });
      }
      booted = true;
      // v5.1: the realtime update watch starts as soon as the page boots
      watchAppMeta();
      return true;
    }).catch(function (e) {
      log("boot failed: " + e);
      return false;
    });
  }

  function resubscribe() {
    if (!auth || !auth.currentUser) return;
    var st = readState();
    if (!st || !st.pairs) return;
    myUid = st.myUid || (auth.currentUser && auth.currentUser.uid) || "";
    // subscribe to every pair (items are {key, name} objects from oh_chat_state)
    (st.pairs || []).forEach(function (p) { subscribePair(p); });
    // unsubscribe removed pairs
    Object.keys(unsubs).forEach(function (k) {
      var still = (st.pairs || []).some(function (p) { return p.key === k; });
      if (!still) {
        try { unsubs[k](); } catch (e) {}
        delete unsubs[k];
      }
    });
  }

  // ==================== v5.1: INSTANT UPDATE NOTIFICATION ====================
  // Owner: "আমি যখনই ভার্সন আপডেট করি, তখনই — ইউজারদের অ্যাপসের ভেতরে না
  // ঢুকেই — সবার মোবাইলে নোটিফিকেশন চলে যাবে: নতুন আপডেট চলে আসছে, আপনারা
  // আপডেটটা নিয়ে নতুন ফিচারগুলো উপভোগ করুন।"
  //
  // A realtime onSnapshot on app/meta — fires the MOMENT the owner hits Save
  // in the panel (was a 5-min getDoc poll in v3.3; now it lands in seconds).
  // Fires ONCE per new version (dedupe cache in localStorage).

  var VERSION_KEY = "oh_notified_versions";

  function readNotifiedVersions() {
    try { return JSON.parse(localStorage.getItem(VERSION_KEY) || "[]"); } catch (e) { return []; }
  }
  function writeNotifiedVersions(arr) {
    try { localStorage.setItem(VERSION_KEY, JSON.stringify(arr.slice(-50))); } catch (e) {}
  }

  // v2.7+ style semver compare: "2.9.1" > "2.9.0" → true
  function versionGt(a, b) {
    if (!a || !b) return false;
    var pa = String(a).split(/[.+-]/), pb = String(b).split(/[.+-]/);
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var na = parseInt(pa[i] || "0", 10) || 0;
      var nb = parseInt(pb[i] || "0", 10) || 0;
      if (na > nb) return true;
      if (na < nb) return false;
    }
    return false;
  }

  function myBuildVersion() {
    var cur = "";
    try {
      var st = readState();
      cur = (st && (st.buildVersion || st.appVersion)) || "";
      if (!cur) cur = localStorage.getItem("oh_app_version") || "";
    } catch (e) {}
    return cur;
  }

  function fireUpdateNotif(meta) {
    var latest = meta.latestVersion;
    if (!latest) return;
    // v5.3.0: FCM push is live on this phone → the owner's admin-panel
    // broadcast delivers the update notification; this legacy path stays quiet.
    try {
      var stNow = readState();
      if (stNow && stNow.fcm) return;
    } catch (e) {}
    var cur = myBuildVersion();
    if (!cur) return; // unknown current → don't notify
    if (!versionGt(latest, cur)) return; // not newer than this build
    var notified = readNotifiedVersions();
    if (notified.indexOf(latest) >= 0) return; // once per version
    notified.push(latest);
    writeNotifiedVersions(notified);

    // v5.1: tap → open the app AND force an instant config refresh so the
    // update bar is already waiting (the flag is read in the main app)
    try { localStorage.setItem("oh_refresh_cfg", "1"); } catch (e) {}

    var title = "🔄 " + (window.__hasBn ? "নতুন আপডেট চলে আসছে!" : "New update available!");
    var bnBody = "v" + latest + (meta.changelog ? (" — " + meta.changelog) : "") +
      " — অ্যাপটি আপডেট করে নতুন ফিচারগুলো উপভোগ করুন।";
    var enBody = "v" + latest + (meta.changelog ? (" — " + meta.changelog) : "") +
      " — update the app to enjoy the new features.";
    var body = window.__hasBn ? bnBody : enBody;
    try {
      if (window.OHNative && window.OHNative.postNotification) {
        window.OHNative.postNotification(title, body, "app_update_" + latest);
      }
      log("update notif posted for v" + latest);
    } catch (e) { log("update notif failed: " + e); }
  }

  /** Realtime watch: one onSnapshot on app/meta — fires on EVERY owner save. */
  function watchAppMeta() {
    if (metaUnsub || !db) return;
    try {
      loadMod("firebase-firestore.js").then(function (fs) {
        try {
          metaUnsub = fs.onSnapshot(fs.doc(db, "app", "meta"), function (snap) {
            if (snap.exists()) fireUpdateNotif(snap.data() || {});
          }, function (err) {
            log("meta watch error: " + (err && err.code ? err.code : err));
            try { if (metaUnsub) { metaUnsub(); metaUnsub = null; } } catch (e) {}
          });
          log("meta watch live (realtime update notifs)");
        } catch (e) { log("meta watch setup failed: " + e); }
      }).catch(function (e) { log("fs load for meta watch failed: " + e); });
    } catch (e) { log("meta watch err: " + e); }
  }

  // ==================== v5.1: HEARTBEAT for the admin panel ====================
  // Written on every cycle — the in-app admin panel shows জীবিত ✓ when this
  // is fresher than 90s.
  function beat() {
    try { localStorage.setItem("oh_listener_hb", String(Date.now())); } catch (e) {}
  }

  // retry boot until the state appears (the app may not have written it yet)
  var bootTries = 0;
  var bootTimer = setInterval(function () {
    if (booted) { clearInterval(bootTimer); return; }
    bootTries++;
    if (bootTries > 120) { clearInterval(bootTimer); log("giving up after 120 tries"); return; }
    boot();
  }, 5000);

  // v5.1 TEST HOOK (harmless in production — used only by the verify suite to
  // drive fireUpdateNotif with synthetic versions; no user-facing surface).
  try {
    window.OH_DEBUG = { fireUpdateNotif: fireUpdateNotif, versionGt: versionGt, myBuildVersion: myBuildVersion };
  } catch (e) {}

  // poll the state so new/removed friends are followed without a reload
  setInterval(function () {
    if (!booted) return;
    resubscribe();
    if (db && !metaUnsub) watchAppMeta(); // re-arm the realtime update watch if it dropped
    beat();
  }, 30000);

  beat();
  boot();
})();
</script>
</body>
</html>
