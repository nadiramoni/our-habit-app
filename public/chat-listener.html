<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our Habit — chat listener</title>
</head>
<body>
<script>
/**
 * chat-listener.html — v2.9 BACKGROUND CHAT NOTIFICATIONS (owner: "মেসেজ
 * দিলে মেসেঞ্জারের মত নোটিফিকেশন আসবে — অ্যাপসে ঢুকে দেখলে তো হবে না")।
 *
 * This page runs inside OhKeepAliveService's HEADLESS WebView on the SAME
 * origin as the app (https://localhost) — it therefore shares localStorage
 * with the main app:
 *   • "oh_chat_state" — written by the main app: {cfg, myUid, pairs, …}
 *   • "firebase:authUser:<apiKey>:[DEFAULT]" — the signed-in session, written
 *     by the main app's auth (browserLocalPersistence — v2.9's persistence fix)
 *   • "oh_chat_last_{pairKey}" — v5.0: the SAME per-pair last-seen key the
 *     main app's watchdog writes. The service and the app are ONE inbox.
 *
 * It restores the session, subscribes to every pair's chat messages
 * (pairs/{pairKey}/notes where kind=="chat") and calls
 * OHNative.postNotification() (the Android bridge) when a message from a
 * FRIEND arrives → a REAL Android notification with sound, even when the
 * main app is closed. The service mutes itself while the app is foreground.
 *
 * v5.0 (owner round-19):
 *   • NO MORE 2-MINUTE SWALLOW — the old "createdAt older than 120s → skip"
 *     rule dropped messages that arrived while the recipient's internet was
 *     OFF (they arrive "stale" the moment the network returns). Now each
 *     pair keeps a last-seen baseline in the SHARED localStorage
 *     (oh_chat_last_{key}): anything NEWER than the baseline notifies, so a
 *     reconnect after minutes/hours offline still fires the notification —
 *     while a service restart never re-notifies old history.
 *   • DEEP LINK — the notification carries the friend's uid+name; tapping it
 *     opens the app straight INTO that chat (MainActivity → pendingOpenChat).
 *   • hiddenBy — messages the user deleted "for me only" never notify.
 *   • PRESENCE HEARTBEAT — every ~45s the page merge-writes
 *     usersIndex/{myUid}.lastSeen, so friends see the user ONLINE even while
 *     the app is CLOSED (a real server connection — exactly the owner's
 *     rule). If the connection dies the writes stop → the dot goes red.
 *
 * Loaded from assets by the service; NEVER shown to the user.
 */
(function () {
  "use strict";

  function log(msg) {
    try { if (window.OHNative && window.OHNative.log) window.OHNative.log(String(msg)); } catch (e) {}
    try { console.log("[chat-listener]", msg); } catch (e) {}
  }

  var FB_VER = "10.12.2";
  var app = null, db = null, auth = null, unsubs = {}, myUid = "", booted = false;
  var lastPresenceBeat = 0;

  function readState() {
    try {
      var raw = localStorage.getItem("oh_chat_state");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // dynamic import of the firebase CDN modules (returns a promise)
  function loadMod(name) {
    // globalThis.import exists in modern WebViews only
    return import("https://www.gstatic.com/firebasejs/" + FB_VER + "/" + name);
  }

  function subscribePair(pair) {
    if (!pair || !pair.key || unsubs[pair.key]) return;
    try {
      loadMod("firebase-firestore.js").then(function (fs) {
        try {
          var q = fs.query(fs.collection(db, "pairs", pair.key, "notes"), fs.orderBy("createdAt", "asc"));
          unsubs[pair.key] = fs.onSnapshot(q, function (snap) {
            // v5.0: walk the WHOLE (small) snapshot and find the newest
            // message that is VISIBLE to me (kind:chat, not hiddenBy me,
            // not my own) — then compare with the shared last-seen baseline.
            var maxAt = 0, latest = null;
            snap.forEach(function (doc) {
              var d = doc.data();
              if (!d || d.kind !== "chat") return;
              if ((d.hiddenBy || []).indexOf(myUid) >= 0) return; // v5.0: deleted from my side
              if (d.from === myUid) return; // my own message — no notification
              if (d.createdAt && d.createdAt > maxAt) { maxAt = d.createdAt; latest = d; }
            });
            var seenKey = "oh_chat_last_" + pair.key;
            var seen = 0;
            try { seen = Number(localStorage.getItem(seenKey) || 0); } catch (e) {}
            if (maxAt > 0) {
              if (!seen) {
                // FIRST snapshot of this pair (service cold start): the whole
                // history becomes the baseline — silent, no re-notify spam.
                try { localStorage.setItem(seenKey, String(maxAt)); } catch (e) {}
              } else if (maxAt > seen) {
                // NEW message → update the baseline + post the notification.
                // Works for messages that arrived while we were OFFLINE too
                // (the v5.0 fix — the old 120s staleness rule is gone).
                try { localStorage.setItem(seenKey, String(maxAt)); } catch (e) {}
                var name = (latest.fromName || pair.name || "Our Habit");
                var title = "💬 " + name;
                var body = latest.text
                  || (latest.image ? "📷 " + (window.__hasBn ? "একটা ছবি পাঠিয়েছে" : "sent a photo")
                  : (latest.audio ? "🎙️ " + (window.__hasBn ? "একটা ভয়েস মেসেজ পাঠিয়েছে" : "sent a voice message")
                  : (window.__hasBn ? "নতুন মেসেজ" : "New message")));
                try {
                  if (window.OHNative && window.OHNative.postNotification) {
                    // v5.0: the last two args are the DEEP LINK — tapping the
                    // notification opens this exact chat.
                    window.OHNative.postNotification(title, body, pair.key, pair.uid || "", name);
                  }
                } catch (e) { log("notify failed: " + e); }
              }
            }
          }, function (err) {
            log("listener error " + pair.key + ": " + (err && err.code ? err.code : err));
            // rules/permission problem or offline — retry later via the state poll
            try { if (unsubs[pair.key]) { unsubs[pair.key](); delete unsubs[pair.key]; } } catch (e) {}
          });
          log("subscribed " + pair.key);
        } catch (inner) {
          log("subscribe failed: " + (inner && inner.message ? inner.message : String(inner)));
          // retry on the next state poll
          try { if (unsubs[pair.key]) { unsubs[pair.key](); delete unsubs[pair.key]; } } catch (e) {}
        }
      }).catch(function (e) { log("fs module load failed: " + e); });
    } catch (e) {
      log("subscribe error: " + e);
    }
  }

  // ==================== v5.0: PRESENCE HEARTBEAT ====================
  // Owner round-19: "শুধু মোবাইলের ইন্টারনেট চালু থাকলেই সব সময় ব্যবহারকারীকে
  // অনলাইন দেখানো যাবে না — অ্যাপের সার্ভারের সঙ্গে তার প্রকৃত সংযোগ যাচাই
  // হতে হবে।" While the app is CLOSED this headless page IS that real
  // connection: every ~45s it merge-writes usersIndex/{myUid}.lastSeen.
  // If the internet dies the write fails → the friends' dots go red ≤2 min.
  function presenceBeat() {
    try {
      if (!db || !myUid) return;
      if (Date.now() - lastPresenceBeat < 45000) return;
      loadMod("firebase-firestore.js").then(function (fs) {
        try {
          fs.setDoc(fs.doc(db, "usersIndex", myUid), { lastSeen: Date.now() }, { merge: true })
            .then(function () { lastPresenceBeat = Date.now(); })
            .catch(function (e) { log("presence write failed (offline?)"); });
        } catch (e) { log("presence err"); }
      }).catch(function () {});
    } catch (e) {}
  }

  function boot() {
    var st = readState();
    if (!st || !st.cfg || !st.cfg.apiKey || !st.cfg.projectId) {
      log("no state yet — waiting for the main app to write oh_chat_state");
      return false;
    }
    window.__hasBn = (st.lang || "bn") === "bn";
    return Promise.all([
      loadMod("firebase-app.js"),
      loadMod("firebase-auth.js"),
      loadMod("firebase-firestore.js")
    ]).then(function (mods) {
      var fbapp = mods[0], fbauth = mods[1], fs = mods[2];
      if (!app) {
        app = fbapp.initializeApp(st.cfg);
        db = fs.getFirestore(app);
        // localStorage persistence → restores the MAIN app's session (same origin)
        auth = fbauth.initializeAuth(app, {
          persistence: fbauth.browserLocalPersistence
        });
        fbauth.onAuthStateChanged(auth, function (u) {
          myUid = u ? u.uid : "";
          log("auth state: " + (u ? "signed in " + u.uid : "signed out"));
          resubscribe();
        });
      }
      booted = true;
      return true;
    }).catch(function (e) {
      log("boot failed: " + e);
      return false;
    });
  }

  function resubscribe() {
    if (!auth || !auth.currentUser) return;
    var st = readState();
    if (!st || !st.pairs) return;
    myUid = st.myUid || (auth.currentUser && auth.currentUser.uid) || "";
    // subscribe to every pair ({key, name, uid} objects from oh_chat_state)
    (st.pairs || []).forEach(function (p) { subscribePair(p); });
    // unsubscribe removed pairs
    Object.keys(unsubs).forEach(function (k) {
      var still = (st.pairs || []).some(function (p) { return p.key === k; });
      if (!still) {
        try { unsubs[k](); } catch (e) {}
        delete unsubs[k];
      }
    });
  }

  // ==================== v3.3: BACKGROUND UPDATE NOTIFICATION ====================
  // Owner: "নতুন আপডেট দিলে পুরোনো ভার্সন ইউজারদের কাছে অটো নোটিফিকেশন যাবে।"
  // Polls app/meta every 5 min for latestVersion + forceUpdate + apkUrl. When
  // latestVersion > the version this APK was built with (stored in oh_chat_state
  // by the main app at sign-in as "buildVersion"), posts an Android notif.
  // The notif fires ONCE per new version (notifiedVersions cache in localStorage)
  // so we don't spam the user every 5 min.

  var VERSION_KEY = "oh_notified_versions";
  var lastUpdateCheck = 0;
  var UPDATE_CHECK_INTERVAL = 5 * 60 * 1000; // 5 min — same cadence as the main app

  function readNotifiedVersions() {
    try { return JSON.parse(localStorage.getItem(VERSION_KEY) || "[]"); } catch (e) { return []; }
  }
  function writeNotifiedVersions(arr) {
    try { localStorage.setItem(VERSION_KEY, JSON.stringify(arr.slice(-50))); } catch (e) {}
  }

  // v2.7+ style semver compare: "2.9.1" > "2.9.0" → true
  function versionGt(a, b) {
    if (!a || !b) return false;
    var pa = String(a).split(/[.+-]/), pb = String(b).split(/[.+-]/);
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var na = parseInt(pa[i] || "0", 10) || 0;
      var nb = parseInt(pb[i] || "0", 10) || 0;
      if (na > nb) return true;
      if (na < nb) return false;
    }
    return false;
  }

  function checkAppUpdate() {
    if (!booted || !db) return;
    var now = Date.now();
    if (now - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
    lastUpdateCheck = now;
    try {
      loadMod("firebase-firestore.js").then(function (fs) {
        try {
          fs.getDoc(fs.doc(db, "app", "meta")).then(function (snap) {
            if (!snap.exists()) return;
            var meta = snap.data() || {};
            var latest = meta.latestVersion;
            if (!latest) return;
            // the build's version comes from oh_chat_state (main app writes it)
            var st = readState();
            var cur = (st && (st.buildVersion || st.appVersion)) || "";
            if (!cur) {
              // fallback: try localStorage written at install time
              try { cur = localStorage.getItem("oh_app_version") || ""; } catch (e) {}
            }
            if (!cur) return; // unknown current → don't notify
            if (!versionGt(latest, cur)) return; // not newer

            // dedupe — only notify ONCE per version
            var notified = readNotifiedVersions();
            if (notified.indexOf(latest) >= 0) return;
            notified.push(latest);
            writeNotifiedVersions(notified);

            var title = "🔄 " + (window.__hasBn ? "অ্যাপ আপডেট এসেছে" : "App update available");
            var body = (window.__hasBn ? "v" : "v") + latest + (meta.changelog ? (" — " + meta.changelog) : (window.__hasBn ? " — অ্যাপ খুলে আপডেট করো" : " — open the app to update"));
            try {
              if (window.OHNative && window.OHNative.postNotification) {
                window.OHNative.postNotification(title, body, "app_update_" + latest, "", "Our Habit");
              }
              log("update notif posted for v" + latest);
            } catch (e) { log("update notif failed: " + e); }
          }).catch(function (e) { log("meta read failed: " + e); });
        } catch (e) { log("meta read err: " + e); }
      }).catch(function (e) { log("fs load for update failed: " + e); });
    } catch (e) { log("update check err: " + e); }
  }

  // retry boot until the state appears (the app may not have written it yet)
  var bootTries = 0;
  var bootTimer = setInterval(function () {
    if (booted) { clearInterval(bootTimer); return; }
    bootTries++;
    if (bootTries > 120) { clearInterval(bootTimer); log("giving up after 120 tries"); return; }
    boot();
  }, 5000);

  // poll the state so new/removed friends are followed without a reload;
  // v5.0: the same poll carries the presence heartbeat.
  setInterval(function () {
    if (!booted) return;
    resubscribe();
    presenceBeat();
    checkAppUpdate();
  }, 30000);

  boot();
})();
</script>
</body>
</html>
